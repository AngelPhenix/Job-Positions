<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 100" width="100%" height="100%">
  <style>
    .text-title {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-weight: 700;
      font-size: 32px;
      fill: #ffffff;
      dominant-baseline: middle;
    }
  </style>

  <!-- Loupe / Icône -->
  <g transform="translate(10, 10)">
    <!-- Manche de la loupe -->
    <rect x="22" y="52" width="22" height="12" rx="6" fill="#D4AF37" transform="rotate(45 22 52)" />
    
    <!-- Cercle extérieur de la loupe -->
    <circle cx="45" cy="45" r="30" fill="none" stroke="#D4AF37" stroke-width="10" />
    
    <!-- Fond intérieur de la loupe -->
    <circle cx="45" cy="45" r="22" fill="#111827" />
    
    <!-- Carré accentué à l'intérieur -->
    <rect x="35" y="35" width="20" height="20" rx="4" fill="#10B981" />
  </g>

  <!-- Texte du Logo -->
  <text x="105" y="52" class="text-title">Job Positions</text>
</svg>
